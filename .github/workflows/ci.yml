name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python — ruff + pytest ──────────────────────────────────────────────────
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pr002
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pr002_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr002"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format --check backend/

      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://pr002:testpassword@localhost:5432/pr002_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          DATA_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PHONE_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_ENV: dev
        run: pytest backend/ -x -q --tb=short

  # ── AI service ─────────────────────────────────────────────────────────────
  ai:
    name: AI service (ruff + pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AI dependencies
        run: pip install -r ai/requirements.txt

      - name: Ruff lint
        run: ruff check ai/

      - name: Pytest (fast unit tests only)
        run: pytest ai/ -x -q --tb=short -m "not slow"

  # ── Frontend — ESLint + tsc + Vitest ───────────────────────────────────────
  frontend:
    name: Frontend (lint + type-check + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Vitest
        run: npx vitest run
        working-directory: frontend

  # ── Docker build check ─────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: pr002-api:ci

      - name: Build AI image
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: false
          tags: pr002-ai:ci

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: pr002-web:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.com
            NEXT_PUBLIC_USE_MOCKS=false
